<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Traveloop | Packing Checklist</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://unpkg.com/aos@2.3.4/dist/aos.css" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/responsive.css" />
  <link rel="stylesheet" href="css/animations.css" />
</head>
<body>
  <header class="site-header sticky-top glass-backdrop shadow-sm">
    <div class="container d-flex align-items-center justify-content-between py-3">
      <a href="dashboard.html" class="brand fw-bold fs-4 text-primary">Traveloop</a>
      <nav class="d-none d-lg-flex gap-3">
        <a class="nav-link" href="budget.html">Budget</a>
        <a class="nav-link active" href="packing-checklist.html">Checklist</a>
        <a class="nav-link" href="notes.html">Notes</a>
      </nav>
      <button id="toggleTheme" class="btn btn-icon btn-outline-secondary"><i class="fas fa-moon"></i></button>
    </div>
  </header>
  <main class="py-6">
    <div class="container">
      <div class="row g-4 align-items-center mb-4" data-aos="fade-up">
        <div class="col-lg-8">
          <span class="eyebrow text-sky">Pack smarter</span>
          <h2 class="fw-bold">Interactive travel checklist</h2>
        </div>
        <div class="col-lg-4 text-lg-end">
          <button class="btn btn-primary" onclick="location.href='create-trip.html'">Add trip items</button>
        </div>
      </div>
      <div class="row g-4">
        <div class="col-xl-4" data-aos="fade-up" data-aos-delay="100">
          <div class="glass-card p-4 shadow-sm">
            <h5 class="mb-3">Packing progress</h5>
            <div class="progress rounded-pill bg-light mb-3" style="height: 16px;"><div id="checklistProgress" class="progress-bar bg-primary rounded-pill" style="width: 25%"></div></div>
            <div id="checklistProgressText" class="small text-muted">25% complete</div>
          </div>
          <div class="glass-card p-4 shadow-sm mt-4">
            <h6 class="mb-3">Smart suggestions</h6>
            <ul class="list-unstyled mb-0">
              <li class="mb-3"><strong>Essentials</strong><br><small class="text-muted">Power bank, adaptors, travel wallet.</small></li>
              <li class="mb-3"><strong>Comfort</strong><br><small class="text-muted">Noise-canceling earbuds, travel pillow.</small></li>
              <li><strong>Style</strong><br><small class="text-muted">Evening wear, lightweight layers.</small></li>
            </ul>
          </div>
        </div>
        <div class="col-xl-8" data-aos="fade-up" data-aos-delay="150">
          <div class="glass-card p-4 shadow-sm mb-4">
            <div class="d-flex gap-3 flex-wrap mb-4">
              <input id="checkItemInput" class="form-control form-control-lg flex-grow-1" type="text" placeholder="Add checklist item" />
              <button id="addCheckItem" class="btn btn-primary btn-lg">Add</button>
            </div>
            <div id="checklistBoard"></div>
          </div>
          <div class="text-end">
            <button id="resetChecklist" class="btn btn-outline-secondary">Reset checklist</button>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>
  <script src="js/app.js"></script>
  <script src="js/checklist.js"></script>
</body>
</html>
