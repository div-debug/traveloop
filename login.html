<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Traveloop | Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://unpkg.com/aos@2.3.4/dist/aos.css" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/responsive.css" />
  <link rel="stylesheet" href="css/animations.css" />
</head>
<body class="page-login">
  <div class="page-loader" id="pageLoader"><div class="spinner-border text-white" role="status"></div></div>
  <main class="login-page min-vh-100 d-flex align-items-center justify-content-center position-relative overflow-hidden">
    <div class="bg-image"></div>
    <div class="bg-gradient"></div>
    <div class="container position-relative z-2">
      <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6" data-aos="zoom-in">
          <div class="glass-card shadow-xl p-5">
            <div class="text-center mb-4">
              <a href="index.html" class="text-white fs-3 fw-bold text-decoration-none">Traveloop</a>
              <p class="text-white text-opacity-75 mt-3">Secure login for your luxury travel studio.</p>
            </div>
            <form id="loginForm" class="needs-validation" novalidate>
              <div class="form-floating mb-3">
                <input type="email" class="form-control form-control-lg" id="loginEmail" placeholder="name@domain.com" required />
                <label for="loginEmail">Email address</label>
                <div class="invalid-feedback">Please enter a valid email.</div>
              </div>
              <div class="form-floating mb-2 position-relative">
                <input type="password" class="form-control form-control-lg" id="loginPassword" placeholder="Password" required />
                <label for="loginPassword">Password</label>
                <button type="button" class="password-toggle" id="loginToggle"><i class="fas fa-eye"></i></button>
                <div class="invalid-feedback">Please provide your password.</div>
              </div>
              <div class="d-flex justify-content-between align-items-center mb-4 text-white text-opacity-75 small">
                <div class="form-check">
                  <input class="form-check-input" type="checkbox" value="" id="rememberMe" />
                  <label class="form-check-label" for="rememberMe">Remember me</label>
                </div>
                <a href="#" class="text-white text-opacity-75">Forgot password?</a>
              </div>
              <button class="btn btn-primary btn-lg w-100 py-3" id="loginButton" type="submit">
                <span class="button-text">Login</span>
                <span class="button-spinner visually-hidden"><span class="spinner-border spinner-border-sm"></span></span>
              </button>
              <div class="divider my-4 text-center text-white text-opacity-75">Or continue with</div>
              <div class="d-flex gap-3 mb-4">
                <button type="button" class="btn btn-outline-light flex-fill"><i class="fab fa-google me-2"></i>Google</button>
                <button type="button" class="btn btn-outline-light flex-fill"><i class="fab fa-apple me-2"></i>Apple</button>
              </div>
              <p class="text-center text-white text-opacity-75 mb-0">Don't have an account? <a href="signup.html" class="text-white text-decoration-underline">Sign up</a></p>
            </form>
          </div>
        </div>
      </div>
      <div class="floating-card glass-card p-3 shadow-sm position-absolute top-0 start-0 translate-middle badge-card" data-aos="fade-down">
        <p class="mb-1 text-white text-opacity-75 small">Live travel updates</p>
        <strong class="text-white">12 new suggestions</strong>
      </div>
      <div class="floating-card glass-card p-3 shadow-sm position-absolute bottom-0 end-0 translate-middle badge-card" data-aos="fade-up">
        <p class="mb-1 text-white text-opacity-75 small">Featured experiences</p>
        <strong class="text-white">Sky lounge dinner</strong>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
